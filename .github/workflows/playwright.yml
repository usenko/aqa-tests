name: Playwright Tests
on:
  push:
    branches: [main, configs]
  pull_request:
    branches: [main, configs]
jobs:
  e2e:
    name: E2E tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      CARD_NUMBER: ${{secrets.CARD_NUMBER}}
      CARD_DATE: ${{secrets.CARD_DATE}}
      UI_BASE_URL: ${{secrets.UI_BASE_URL}}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run E2E
        run: npm run ui-e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-e2e
          path: playwright-report/
          retention-days: 5

  api:
    name: API tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{secrets.API_BASE_URL}}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run API
        run: npm run api
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-api
          path: playwright-report/
          retention-days: 5
